<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoLoG Africa · AI Safety Field-building For Africa</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @property --gx{ syntax:'<percentage>'; inherits:true; initial-value:78%; }
  @property --gy{ syntax:'<percentage>'; inherits:true; initial-value:88%; }
  *{ box-sizing:border-box; }
  html, body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#12180F; font-family:'Instrument Sans', sans-serif;
  }
  a{ color:inherit; text-decoration:none; }

  .stage{ position:relative; width:100vw; height:100vh; height:100dvh; overflow:hidden; }

  /* Base: dark green ground, matching CoLoG's hero-band palette */
  .base{
    position:absolute; inset:0;
    background:linear-gradient(160deg, #10140C 0%, #161F10 42%, #1C2A15 100%);
  }

  /* Bloom: the same green -> sage -> white progression as the site's hero band,
     concentrated as a soft glow instead of a full-bleed fade, so the screen stays
     dark enough for the type to sit on top of it. */
  .bloom{
    position:absolute; inset:0;
    transition: --gx 1.1s cubic-bezier(.16,.84,.44,1), --gy 1.1s cubic-bezier(.16,.84,.44,1);
    animation: breathe 7s ease-in-out infinite;
    background:
      radial-gradient(circle at calc(var(--gx) + 4%) var(--gy), rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 38%),
      radial-gradient(circle at var(--gx) calc(var(--gy) - 6%), rgba(183,206,154,0.55) 0%, rgba(183,206,154,0) 46%),
      radial-gradient(circle at calc(var(--gx) - 10%) calc(var(--gy) + 4%), rgba(124,143,94,0.55) 0%, rgba(124,143,94,0) 55%);
  }
  @keyframes breathe{ 0%,100%{ opacity:1; } 50%{ opacity:0.82; } }

  /* Faint ridge texture, echoing the main site's hero band, kept subtle so it reads
     as material rather than decoration. */
  .ridge{
    position:absolute; inset:0; opacity:0.5; mix-blend-mode:soft-light; pointer-events:none;
    background:repeating-linear-gradient(to bottom,
      rgba(255,255,255,0.5) 0px, rgba(255,255,255,0.15) 1px,
      rgba(0,0,0,0.25) 2px, rgba(0,0,0,0.32) 3px,
      rgba(0,0,0,0.14) 4px, rgba(255,255,255,0.12) 5px,
      rgba(255,255,255,0.5) 6px);
    background-size:100% 6px;
  }

  .stage .content{ position:relative; z-index:2; width:100%; height:100%; }

  /* ---------- Nav ---------- */
  nav{ position:absolute; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:clamp(20px,3.2vw,40px) clamp(24px,4.5vw,56px); }
  .mark{ display:flex; align-items:baseline; gap:9px; font-weight:700; font-size:16px; color:#F4F5EF; }
  .mark .ring{ width:8px; height:8px; border-radius:50%; background:#FF4433; align-self:center; }
  .mark .sub{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:rgba(244,245,239,0.55); font-weight:500; border-left:1px solid rgba(244,245,239,0.25); padding-left:9px; margin-left:1px; }
  .fellowship-link{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; font-size:13.5px; color:#F4F5EF; }
  .fellowship-link .label{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(244,245,239,0.5); }
  .fellowship-link .name{ padding-bottom:3px; border-bottom:1px solid rgba(244,245,239,0.45); }
  .linkedin-link{ position:absolute; right:clamp(24px,4.5vw,56px); bottom:clamp(20px,3.2vw,36px); font-size:13.5px; color:#F4F5EF; }
  .linkedin-link .name{ padding-bottom:3px; border-bottom:1px solid rgba(244,245,239,0.45); }

  /* ---------- Headline ---------- */
  .hero-text{ position:absolute; left:clamp(24px,4.5vw,56px); bottom:clamp(48px,9vh,110px); right:clamp(24px,4.5vw,56px); }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:rgba(244,245,239,0.6); display:flex; align-items:center; gap:9px; margin:0 0 clamp(14px,2.4vh,26px); }
  .eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:#FF4433; }
  h1{
    margin:0; font-weight:700; letter-spacing:-0.02em; color:#F7F8F2;
    font-size:clamp(36px,7.2vw,120px); line-height:1.02;
  }
  h1 .accent{ color:#B7CE9A; }

  @media (max-width:640px){
    nav{ flex-wrap:wrap; row-gap:8px; }
    .fellowship-link{ margin-left:auto; text-align:right; font-size:11.5px; }
    h1{ font-size:clamp(26px,9vw,48px); }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="base"></div>
  <div class="bloom"></div>
  <div class="ridge"></div>

  <div class="content">
    <nav>
      <div class="mark"><span class="ring"></span>CoLoG<span class="sub">Africa</span></div>
      <a class="fellowship-link" href="https://docs.google.com/document/d/1fSGEIkpnxqmwj7YCivTP8CRHVeFztchXfJeEvv4raAE/edit?usp=sharing" target="_blank" rel="noopener">
        <span class="name">AI Safety x Content Fellowship</span>
      </a>
    </nav>

    <div class="hero-text">
      <h1>Accelerating AI<br>Safety Talent<br><span class="accent">In Africa</span></h1>
    </div>

    <a class="linkedin-link" href="https://www.linkedin.com/company/colog-africa/" target="_blank" rel="noopener"><span class="name">LinkedIn</span></a>
  </div>
</div>

<script>
  (function(){
    var root = document.documentElement;
    var minX = 58, maxX = 96, minY = 55, maxY = 96;
    window.addEventListener('mousemove', function(e){
      var xPct = e.clientX / window.innerWidth;
      var yPct = e.clientY / window.innerHeight;
      var gx = minX + xPct * (maxX - minX);
      var gy = minY + yPct * (maxY - minY);
      root.style.setProperty('--gx', gx.toFixed(1) + '%');
      root.style.setProperty('--gy', gy.toFixed(1) + '%');
    }, { passive: true });
  })();
</script>

</body>
</html>
